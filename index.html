*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
body{background:linear-gradient(145deg,#f7e9d7,#ecdcc5);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:12px 8px 20px;}
.container{max-width:420px;width:100%;background:rgba(255,248,235,0.95);border-radius:36px;padding:18px 16px 24px;box-shadow:0 12px 32px rgba(80,50,30,0.25);border:1px solid rgba(220,190,160,0.4);}
h1{text-align:center;color:#5a3e2b;margin-bottom:12px;font-size:24px;}
.card{background:#fff;border-radius:24px;padding:24px;margin:12px 0;text-align:center;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,0.08);transition:transform 0.2s;}
.card:active{transform:scale(0.97);}
.en{font-size:32px;font-weight:bold;color:#d35400;margin-bottom:8px;}
.cn{font-size:20px;color:#555;}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:18px;background:#d35400;color:#fff;font-size:18px;margin-top:12px;cursor:pointer;}
.btn:active{background:#b94300;}
.progress{text-align:center;color:#777;margin-top:10px;font-size:14px;}
