<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>怪物抽卡 · 英语学习</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;min-height:100vh;overflow-x:hidden}
.container{max-width:480px;margin:0 auto;padding:16px;text-align:center}
h1{font-size:24px;margin:10px 0 4px;text-shadow:0 2px 10px rgba(255,215,0,0.3)}
.subtitle{font-size:13px;color:#aaa;margin-bottom:12px}
.coins{font-size:16px;color:gold;margin-bottom:10px;background:rgba(255,215,0,0.1);padding:6px 14px;border-radius:20px;display:inline-block}
/* 学习模块 */
.learn-panel{display:none;margin-top:10px;text-align:left}
.word-card{background:rgba(255,255,255,0.06);border-radius:16px;padding:20px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.1);min-height:160px;text-align:center}
.word-english{font-size:28px;font-weight:bold;margin-bottom:8px;color:#fff}
.word-chinese{font-size:18px;color:#ccc;margin-bottom:12px;min-height:30px}
.word-progress{font-size:12px;color:#888;margin-bottom:8px}
.word-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.word-controls button{padding:8px 18px;border-radius:20px;border:none;font-size:14px;cursor:pointer;transition:all 0.2s}
.btn-know{background:#00cc66;color:#fff}
.btn-dont{background:#e94560;color:#fff}
.btn-next{background:#0f3460;color:#fff}
.word-stats{font-size:12px;color:#aaa;margin-top:8px;text-align:center}
.lib-select{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.lib-btn{padding:6px 14px;border-radius:16px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:#aaa;font-size:12px;cursor:pointer}
.lib-btn.active{background:rgba(255,215,0,0.15);border-color:gold;color:gold}
.wrong-book{font-size:12px;color:#ff6666;margin-top:6px;cursor:pointer;text-decoration:underline}
/* 老虎机 */
.slot-machine{background:rgba(255,255,255,0.06);border-radius:20px;padding:16px;margin-bottom:12px;border:2px solid rgba(255,215,0,0.2)}
.slots{display:flex;justify-content:center;gap:10px;margin-bottom:14px;height:110px}
.slot{width:85px;height:100px;background:#1a1a3e;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:45px;border:3px solid #444;transition:all 0.3s;position:relative}
.slot.shake{animation:shake 0.3s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.slot.match{border-color:gold;box-shadow:0 0 20px gold;animation:pulseGold 0.8s infinite}
@keyframes pulseGold{0%,100%{box-shadow:0 0 15px gold}50%{box-shadow:0 0 30px gold}}
.slot.crack{animation:crackAnim 0.4s forwards}
@keyframes crackAnim{0%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:0.5}100%{transform:scale(1);opacity:1}}
.up-badge{background:linear-gradient(135deg,#ff6600,#ff3300);color:#fff;padding:3px 10px;border-radius:16px;font-size:11px;display:inline-block;margin-bottom:6px}
.btn{background:linear-gradient(135deg,#e94560,#c23152);color:#fff;border:none;padding:12px 36px;font-size:16px;border-radius:30px;cursor:pointer;font-weight:bold;box-shadow:0 4px 15px rgba(233,69,96,0.4);transition:all 0.2s;touch-action:manipulation}
.btn:active{transform:scale(0.93)}
.btn:disabled{background:#555;box-shadow:none;cursor:not-allowed}
.btn-small{padding:6px 16px;font-size:13px;border-radius:16px}
.result-text{font-size:16px;margin-top:8px;min-height:24px;font-weight:bold}
/* 宠物卡片 */
.pet-display{margin-top:12px;min-height:140px}
.pet-card{background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));border-radius:16px;padding:16px;border:1px solid rgba(255,255,255,0.15);display:none;animation:fadeIn 0.4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.pet-emoji{font-size:60px;display:block;margin-bottom:4px;cursor:pointer;transition:transform 0.2s;position:relative}
.pet-emoji:active{transform:scale(0.9)}
.pet-name{font-size:18px;font-weight:bold;margin-bottom:3px}
.pet-rarity{display:inline-block;padding:2px 10px;border-radius:16px;font-size:11px;margin-bottom:6px}
.rarity-common{background:#666}
.rarity-rare{background:#0066cc;box-shadow:0 0 8px #0066cc}
.rarity-epic{background:#9900cc;box-shadow:0 0 12px #9900cc}
.rarity-legendary{background:#ff6600;box-shadow:0 0 16px #ff6600}
.favor-text{font-size:12px;color:#ff99cc;margin-top:3px}
.story-text{font-size:12px;color:#ccc;font-style:italic;margin-top:4px;padding:6px;background:rgba(255,255,255,0.04);border-radius:6px}
.work-status{font-size:12px;color:#88ff88;margin-top:4px}
.mood-text{font-size:11px;color:#aaa;margin-top:2px}
.hearts{position:absolute;pointer-events:none;font-size:20px;animation:heartFloat 0.8s forwards}
@keyframes heartFloat{0%{transform:translateY(0) scale(0.5);opacity:1}100%{transform:translateY(-50px) scale(1.5);opacity:0}}
/* 小游戏 */
.minigame-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;z-index:999;justify-content:center;align-items:center;flex-direction:column}
.minigame-area{width:280px;height:350px;background:#1a1a3e;border-radius:16px;position:relative;overflow:hidden;border:2px solid gold}
.star-falling{position:absolute;font-size:26px;animation:starFall 2s linear forwards;cursor:pointer}
@keyframes starFall{0%{transform:translateY(-30px);opacity:1}100%{transform:translateY(370px);opacity:0.3}}
.minigame-score{font-size:18px;color:gold;margin-top:8px}
/* 签到 */
.checkin-panel{display:none;margin-top:12px}
.checkin-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.checkin-day{background:rgba(255,255,255,0.05);border-radius:6px;padding:8px 2px;text-align:center;font-size:11px;border:1px solid rgba(255,255,255,0.08)}
.checkin-day.done{background:rgba(255,215,0,0.15);border-color:gold;color:gold}
.checkin-day.today{border-color:#e94560;box-shadow:0 0 8px rgba(233,69,96,0.4)}
.challenge-item{background:rgba(255,255,255,0.04);border-radius:8px;padding:8px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.challenge-progress{color:#aaa;font-size:11px}
/* 图鉴 */
.dex{display:none;margin-top:12px;text-align:left}
.dex h3{border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:4px;font-size:14px}
.dex-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px;max-height:240px;overflow-y:auto}
.dex-item{background:rgba(255,255,255,0.04);border-radius:8px;padding:6px 2px;text-align:center;font-size:10px;border:1px solid rgba(255,255,255,0.06)}
.dex-item.unlocked{border-color:gold;background:rgba(255,215,0,0.1)}
.dex-emoji{font-size:24px;display:block}
/* 设置 */
.settings{display:none;margin-top:12px}
.setting-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:8px 16px;border-radius:10px;cursor:pointer;margin:3px;font-size:13px}
/* 导航 */
.nav{display:flex;justify-content:space-around;margin-top:16px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.1)}
.nav-btn{background:none;border:none;color:#888;font-size:13px;padding:6px 10px;cursor:pointer;border-radius:8px;transition:all 0.2s}
.nav-btn.active{color:gold;background:rgba(255,215,0,0.1)}
/* 特效 */
.effect-particle{position:fixed;pointer-events:none;font-size:24px;animation:particleFly 1s forwards}
@keyframes particleFly{0%{transform:translate(0,0) scale(0.5);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(1.5);opacity:0}}
.bonus-text{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:bold;color:gold;text-shadow:0 0 25px gold;pointer-events:none;animation:bonusPop 1.2s forwards}
@keyframes bonusPop{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
/* 名片 */
.card-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:none;z-index:998;justify-content:center;align-items:center;flex-direction:column}
.business-card{width:300px;padding:24px 16px;background:linear-gradient(135deg,#1a1a3e,#302b63);border-radius:16px;border:2px solid gold;text-align:center}
.card-title{font-size:20px;font-weight:bold;color:gold;margin-bottom:8px}
.card-pet{font-size:50px;display:block;margin:8px 0}
.card-info{font-size:13px;color:#ccc;line-height:1.6}
.card-footer{font-size:10px;color:#666;margin-top:12px}
</style>
</head>
<body>
<div class="container" id="appContainer">
  <h1>🎮 英语学习 · 怪物抽卡</h1>
  <div class="subtitle">背单词赚币 · 抽卡养宠物</div>
  <div class="coins">💰 <span id="coins">15</span> 币 | 📚 已学 <span id="wordCount">0</span> 词</div>

  </div>
  
  <!-- 抽卡面板 -->

    <div class="slots">
      <div class="slot" id="s1">❓</div>
      <div class="slot" id="s2">❓</div>

  </div>
  
  <!-- 签到面板 -->
  <div class="checkin-panel" id="tabCheckin" style="display:none">

    <div id="checkinResult" style="font-size:13px;color:gold;margin-top:4px"></div>
    <h3 style="margin-top:12px;font-size:14px">🏆 每日挑战</h3>
    <div id="challenges"></div>
  </div>
  
  <!-- 图鉴面板 -->
  <div class="dex" id="tabDex" style="display:none">
    <h3>📖 宠物图鉴 (<span id="unlockedCount">0</span>/10)</h3>
    <div class="dex-grid" id="dexGrid"></div>
  </div>
  
  <!-- 设置面板 -->
  <div class="settings" id="tabSettings" style="display:none">
    <h3>⚙️ 设置</h3>
    <button class="setting-btn" onclick="generateCard()">🃏 生成名片</button>
    <button class="setting-btn" onclick="exportSave()">📤 导出存档</button>
    <button class="setting-btn" onclick="importSave()">📥 导入存档</button>
    <div style="font-size:11px;color:#aaa;margin-top:6px">背单词赚币 · 点击宠物加好感</div>
  </div>
  
  <!-- 宠物展示 -->
  <div class="pet-display" id="petDisplay"></div>
  
  <!-- 导航 -->
  <div class="nav">
    <button class="nav-btn active" onclick="switchTab('learn',this)">📚学习</button>
    <button class="nav-btn" onclick="switchTab('main',this)">🎰抽卡</button>
    <button class="nav-btn" onclick="switchTab('checkin',this)">📅签到</button>
    <button class="nav-btn" onclick="switchTab('dex',this)">📖图鉴</button>
    <button class="nav-btn" onclick="switchTab('settings',this)">⚙️设置</button>
  </div>
</div>

<!-- 小游戏弹窗 -->
<div class="minigame-overlay" id="minigameOverlay">
  <h2 style="font-size:20px">⭐ 接星星</h2>
  <div class="minigame-area" id="minigameArea"></div>
  <div class="minigame-score">得分: <span id="mgScore">0</span> / 10</div>

</div>

<!-- 名片弹窗 -->
<div class="card-overlay" id="cardOverlay">

  </div>
  <button class="btn btn-small" onclick="closeCard()" style="margin-top:16px">关闭</button>
</div>

<script>
// ===== 音效 =====
const AC=window.AudioContext||window.webkitAudioContext;let ac;
function ia(){if(!ac)ac=new AC()}
function pt(f,d,t='sine',v=0.1){try{ia();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function sc(){pt(800,0.06,'square',0.05)}
function ss(){pt(300+Math.random()*400,0.025,'sawtooth',0.035)}
function sw(){pt(523,0.12);setTimeout(()=>pt(659,0.12),80);setTimeout(()=>pt(784,0.16),160)}
function sh(){pt(880,0.16);setTimeout(()=>pt(1100,0.25),120)}
function sco(){pt(1200,0.05)}

// ===== 词库 =====
const WORDS={
  basic:[

    ['umbrella','雨伞'],['water','水'],['yellow','黄色'],['zero','零'],['baby','婴儿'],

    ['hand','手'],['island','岛屿'],['jacket','夹克'],['kite','风筝'],['lamp','灯'],
    ['milk','牛奶'],['nose','鼻子'],['owl','猫头鹰'],['pig','猪'],['question','问题'],
    ['river','河流'],['ship','船'],['table','桌子'],['use','使用'],['voice','声音'],
    ['window','窗户'],['box','盒子'],['yard','院子'],['zoo','动物园'],['bird','鸟']
  ],

    ['afford','负担得起'],['agency','代理处'],['agenda','议程'],['agent','代理人'],['agree','同意'],
    ['agriculture','农业'],['allow','允许'],['although','尽管'],['amount','数量'],['analyze','分析'],
    ['ancient','古代的'],['announce','宣布'],['annual','年度的'],['anxiety','焦虑'],['apart','分开地'],
    ['apparent','明显的'],['appeal','呼吁'],['appear','出现'],['apply','申请'],['approach','接近'],

    ['abundant','丰富的'],['academic','学术的'],['accelerate','加速'],['accent','口音'],['acceptable','可接受的'],

// ===== 宠物数据 =====
const PETS={
  common:[
    {id:1,name:'小史莱姆',emoji:'🟢',rarity:'common',desc:'软绵绵的绿色小家伙',story:'从魔法森林的露水中诞生，喜欢在草地上滚来滚去。'},

const ALL_PETS=[...PETS.common,...PETS.rare,...PETS.epic,...PETS.legendary];

// ===== UP池 =====
function getUpPet(){
  const wn=Math.floor(Date.now()/(7*86400000));
  const rs=[...PETS.rare,...PETS.epic,...PETS.legendary];
  return rs[wn%rs.length];
}

// ===== 存档 =====
let S=loadSave();
function defaultSave(){
  return{
    coins:15,unlocked:[],favor:{},pity:0,items:{double:0,reset:0},
    lastVisit:Date.now(),totalDraws:0,

  };

function loadSave(){
  try{
    const raw=localStorage.getItem('petSaveFull');
    if(raw){
      const d=JSON.parse(raw);
      const def=defaultSave();
      for(let k in def)if(d[k]===undefined)d[k]=def[k];
      const el=Math.floor((Date.now()-d.lastVisit)/60000);
      if(el>1&&el<1440){
        const bn=Math.min(Math.floor(el/3),20);
        if(bn>0){d.coins+=bn;setTimeout(()=>sb(`⏰ 离线${el}分钟，获得${bn}币!`),500)}
      }
      for(let pid in d.mood)if(d.mood[pid]<100)d.mood[pid]=Math.min(100,d.mood[pid]+Math.floor(el/5));
      d.lastVisit=Date.now();
      if(d.work.active&&Date.now()>d.work.endTime){d.coins+=5;d.work.active=false;setTimeout(()=>sb('💼 打工完成!获得5币!'),1000)}
      return d;
    }
  }catch(e){}
  return defaultSave();
}
function sv(){S.lastVisit=Date.now();localStorage.setItem('petSaveFull',JSON.stringify(S));}
function sb(t){const e=document.createElement('div');e.className='bonus-text';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}

let currentLib='basic',wordIdx=0,wordKnown=0;
function selectLib(lib,btn){
  sc();
  document.querySelectorAll('.lib-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentLib=lib;
  wordIdx=0;
  wordKnown=0;
  showWord();
}
function showWord(){
  const lib=WORDS[currentLib];
  if(wordIdx>=lib.length)wordIdx=0;
  const w=lib[wordIdx];
  document.getElementById('wordEn').textContent=w[0];
  document.getElementById('wordCn').textContent='???';
  document.getElementById('wordProgress').textContent=`进度: ${wordIdx+1}/${lib.length}`;
  // 尝试发音
  try{
    const u=new SpeechSynthesisUtterance(w[0]);u.lang='en-US';u.rate=0.8;speechSynthesis.speak(u);
  }catch(e){}
}
function markWord(know){
  sc();
  const lib=WORDS[currentLib];
  const w=lib[wordIdx];
  document.getElementById('wordCn').textContent=w[1];
  if(!know){
    if(!S.word.wrong)S.word.wrong=[];
    if(!S.word.wrong.includes(w[0]))S.word.wrong.push(w[0]);
  }else{
    S.word.know=(S.word.know||0)+1;
    S.word.today=(S.word.today||0)+1;
    // 答对奖励
    S.coins+=1;
    updateUI();
    sb('✅ 答对了! +1币');
  }
  updateWordStats();
  sv();
}
function nextWord(){
  sc();
  wordIdx++;
  showWord();
}
function reviewWrong(){
  if(!S.word.wrong||S.word.wrong.length===0){
    document.getElementById('result').textContent='🎉 错题本为空!';
    return;
  }
  // 切换到错题模式
  const w=S.word.wrong[0];
  const lib=WORDS[currentLib];
  const found=lib.findIndex(x=>x[0]===w);
  if(found>=0){wordIdx=found;showWord();}
  document.getElementById('result').textContent='📕 复习错题中...';
}
function updateWordStats(){
  const total=WORDS[currentLib].length;
  const known=S.word.know||0;
  const rate=total>0?Math.round(known/total*100):0;
  document.getElementById('wordStats').textContent=`今日学习: ${S.word.today||0}词 | 掌握率: ${rate}%`;
  document.getElementById('wrongCount').textContent=S.word.wrong?S.word.wrong.length:0;
  document.getElementById('wordCount').textContent=S.word.today||0;
}

let currentPetId=null;
function showPet(pet,isNew){
  currentPetId=pet.id;
  const fav=S.favor[pet.id]||0;
  const level=Math.floor(fav/3)+1;
  const evolved=level>=10;
  const emoji=evolved?pet.emoji+pet.emoji:pet.emoji;
  const mood=S.mood[pet.id]||100;
  const mt=mood>80?'😊开心':mood>50?'😐一般':mood>20?'😞低落':'😢想你';
  const wa=S.work.active&&S.work.petId===pet.id;
  const wr=wa?Math.max(0,Math.floor((S.work.endTime-Date.now())/1000)):0;
  const d=document.getElementById('petDisplay');
  d.innerHTML=`
    <div class="pet-card" style="display:block">
      <span class="pet-emoji" onclick="pc(${pet.id})" style="${evolved?'font-size:72px;filter:drop-shadow(0 0 8px gold)':''}" id="pe">${emoji}</span>
      <div class="pet-name">${pet.name} ${evolved?'✨':'Lv.'+level}</div>
      <div class="pet-rarity rarity-${pet.rarity}">${['普通','稀有','史诗','传说'][['common','rare','epic','legendary'].indexOf(pet.rarity)]}</div>
      <div>${pet.desc}</div>
      <div class="mood-text">${mt}</div>
      <div class="favor-text">❤️ 好感 ${fav}/30 ${evolved?'已进化!':'(点击增加)'}</div>
      ${isNew?`<div style="color:gold;font-weight:bold;margin-top:4px;font-size:13px">✨ 新获得!</div>`:''}
      ${isNew&&pet.story?`<div class="story-text">📖 ${pet.story}</div>`:''}
      ${wa?`<div class="work-status">💼 打工中... 剩余${Math.floor(wr/60)}分${wr%60}秒</div>`:`<button class="btn btn-small" onclick="swork(${pet.id})" style="margin-top:4px;font-size:11px;padding:4px 12px">💼 派去打工(30分钟)</button>`}
    </div>
  `;
}
function pc(id){
  sh();
  S.favor[id]=(S.favor[id]||0)+1;
  S.mood[id]=Math.min(100,(S.mood[id]||100)+5);
  const fav=S.favor[id];
  const level=Math.floor(fav/3)+1;
  const e=document.getElementById('pe');
  if(e){
    for(let i=0;i<3;i++){
      const h=document.createElement('div');h.className='hearts';h.textContent='❤️';
      h.style.left=(e.offsetLeft+20+Math.random()*30)+'px';h.style.top=(e.offsetTop+5)+'px';
      document.getElementById('petDisplay').appendChild(h);
      setTimeout(()=>h.remove(),800);
    }
  }
  if(level>=10&&fav%3===0){
    showPet(ALL_PETS.find(p=>p.id===id),false);
    setTimeout(()=>sb(`🌟 ${ALL_PETS.find(p=>p.id===id).name} 已进化!`),300);
  }
  if(Math.random()<0.15)setTimeout(()=>sm(id),500);
  S.challenges.click=(S.challenges.click||0)+1;
  cc();
  const ft=document.querySelector('.favor-text');
  if(ft)ft.textContent=`❤️ 好感 ${fav}/30 ${level>=10?'已进化!':'(点击增加)'}`;
  sv();ui();
}
function swork(id){
  if(S.work.active){alert('已经有宠物在打工了!');return;}
  sc();S.work={active:true,endTime:Date.now()+1800000,petId:id};
  sv();ui();showPet(ALL_PETS.find(p=>p.id===id),false);
  sb('💼 已派去打工，30分钟后回来!');
}

function ic(){
  const g=document.getElementById('checkinGrid');g.innerHTML='';
  for(let i=1;i<=7;i++){
    const d=document.createElement('div');d.className='checkin-day';
    const dn=S.checkin.days&&S.checkin.days.includes(i);
    if(dn)d.classList.add('done');
    if(i===new Date().getDate()%7+1&&!dn)d.classList.add('today');
    d.innerHTML=`<div>Day${i}</div><div>${dn?'✅':['+1币','+2币','+3币','+4币','+5币','+6币','🎁传说'][i-1]}</div>`;
    g.appendChild(d);
  }
  const td=new Date().toDateString();
  const btn=document.getElementById('checkinBtn');
  if(S.checkin.lastDay===td){btn.disabled=true;btn.textContent='今日已签到';}
  else{btn.disabled=false;btn.textContent='签到';}
}
function dc(){
  const td=new Date().toDateString();
  if(S.checkin.lastDay===td){document.getElementById('checkinResult').textContent='今天已经签到了!';return;}
  sc();
  S.checkin.count=(S.checkin.count||0)+1;
  const day=(S.checkin.count-1)%7+1;
  if(!S.checkin.days)S.checkin.days=[];
  if(!S.checkin.days.includes(day))S.checkin.days.push(day);
  const rs=[1,2,3,4,5,6,10];
  const rw=rs[day-1];
  S.coins+=rw;
  S.checkin.lastDay=td;
  if(day===7)sb('🎁 签到满7天!获得传说宠物碎片(10币)!');
  else sb(`📅 签到成功!Day${day} 获得${rw}币!`);
  sv();ui();ic();
  document.getElementById('checkinResult').textContent=`Day${day} 签到成功!+${rw}币`;
}
function ich(){
  const td=new Date().toDateString();
  if(S.challenges.date!==td){S.challenges={draw:0,click:0,collect:S.unlocked.length,date:td};sv();}
  rc();
}

  const c=document.getElementById('challenges');

}
function cc(){

}
