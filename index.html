<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>怪物抽卡游戏</title>
<style>
  :root {
    --bg: #1a1a2e;
    --primary: #e94560;
    --secondary: #0f3460;
    --text: #fff;
  }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow-x: hidden;
    user-select: none;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px;
    text-align: center;
    min-height: 100vh;
    box-sizing: border-box;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 5px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }
  .subtitle {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 20px;
  }
  /* 老虎机区域 */
  .slot-machine {
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    border: 2px solid var(--secondary);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .slots {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
    height: 120px;
  }
  .slot {
    width: 90px;
    height: 110px;
    background: #fff;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    color: #333;
    overflow: hidden;
    position: relative;
    border: 3px solid #ddd;
    transition: transform 0.1s;
  }
  .slot.spinning {
    animation: spin 0.5s linear infinite;
  }
  @keyframes spin {
    0% { transform: translateY(-20px); opacity: 0.5; }
    50% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(20px); opacity: 0.5; }
  }
  .slot.match {
    border-color: gold;
    box-shadow: 0 0 20px gold;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 15px 40px;
    font-size: 18px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
  }
  .btn:active {
    transform: scale(0.95);
  }
  .btn:disabled {
    background: #555;
    box-shadow: none;
    cursor: not-allowed;
  }
  /* 宠物展示 */
  .pet-display {
    margin-top: 20px;
    min-height: 200px;
    position: relative;
  }
  .pet-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
    border-radius: 15px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    display: none;
    animation: fadeIn 0.5s;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .pet-emoji {
    font-size: 80px;
    display: block;
    margin-bottom: 10px;
    animation: breathe 3s ease-in-out infinite;
    position: relative;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.05) translateY(-5px); }
  }
  .pet-emoji::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 10px;
    background: rgba(0,0,0,0.2);
    border-radius: 50%;
    animation: shadow 3s ease-in-out infinite;
  }
  @keyframes shadow {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.2; }
    50% { transform: translateX(-50%) scale(0.9); opacity: 0.1; }
  }
  .pet-name {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 5px;
  }
  .pet-rarity {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    margin-bottom: 10px;
  }
  .rarity-common { background: #666; }
  .rarity-rare { background: #0066cc; box-shadow: 0 0 10px #0066cc; }
  .rarity-epic { background: #9900cc; box-shadow: 0 0 15px #9900cc; }
  .rarity-legendary { background: #ff6600; box-shadow: 0 0 20px #ff6600; }
  
  .effect {
    position: absolute;
    pointer-events: none;
    font-size: 30px;
    animation: floatUp 1.5s forwards;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
  }
  
  .result-text {
    font-size: 20px;
    margin-top: 10px;
    font-weight: bold;
    min-height: 30px;
  }
  .coins {
    font-size: 16px;
    color: gold;
    margin-bottom: 10px;
  }
  
  /* 图鉴 */
  .dex {
    margin-top: 30px;
    text-align: left;
  }
  .dex h3 {
    border-bottom: 2px solid var(--secondary);
    padding-bottom: 5px;
  }
  .dex-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 10px;
  }
  .dex-item {
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 10px 5px;
    text-align: center;
    font-size: 12px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .dex-item.unlocked {
    border-color: gold;
    background: rgba(255,215,0,0.1);
  }
  .dex-emoji {
    font-size: 30px;
    display: block;
  }
  
  /* 稀有宠物特效 */
  .fx-fire { color: #ff4500; text-shadow: 0 0 20px #ff4500; }
  .fx-ice { color: #00bfff; text-shadow: 0 0 20px #00bfff; }
  .fx-thunder { color: #ffd700; text-shadow: 0 0 20px #ffd700; }
  .fx-magic { color: #ff00ff; text-shadow: 0 0 20px #ff00ff; }
</style>
</head>
<body>
<div class="container">
  <h1>🎰 怪物抽卡机</h1>
  <div class="subtitle">3格相同出稀有宠物！</div>
  <div class="coins">💰 抽卡币: <span id="coins">10</span></div>
  
  <div class="slot-machine">
    <div class="slots">
      <div class="slot" id="s1">❓</div>
      <div class="slot" id="s2">❓</div>
      <div class="slot" id="s3">❓</div>
    </div>
    <button class="btn" id="drawBtn" onclick="draw()">🎰 抽卡 (消耗1币)</button>
    <div class="result-text" id="result"></div>
  </div>
  
  <div class="pet-display" id="petDisplay">
    <!-- 宠物卡片动态生成 -->
  </div>
  
  <div class="dex">
    <h3>📖 宠物图鉴 (<span id="unlockedCount">0</span>/10)</h3>
    <div class="dex-grid" id="dexGrid"></div>
  </div>
</div>

<script>
const pets = {
  common: [
    { id: 1, name: '小史莱姆', emoji: '🟢', rarity: 'common', desc: '软绵绵的绿色小家伙' },
    { id: 2, name: '小蝙蝠', emoji: '🦇', rarity: 'common', desc: '怕光的夜行客' },
    { id: 3, name: '小蘑菇', emoji: '🍄', rarity: 'common', desc: '森林里的红帽精灵' },
    { id: 4, name: '小幽灵', emoji: '👻', rarity: 'common', desc: '爱恶作剧的透明魂' },
  ],
  rare: [
    { id: 5, name: '冰霜狼', emoji: '🐺', rarity: 'rare', desc: '踏雪无痕的寒冰之狼', effect: 'fx-ice', skill: '❄️冰冻吐息' },
    { id: 6, name: '雷霆鹰', emoji: '🦅', rarity: 'rare', desc: '翱翔九天的雷电之翼', effect: 'fx-thunder', skill: '⚡雷霆一击' },
    { id: 7, name: '烈焰虎', emoji: '🐯', rarity: 'rare', desc: '威震山林的火焰猛虎', effect: 'fx-fire', skill: '🔥烈焰爪击' },
  ],
  epic: [
    { id: 8, name: '幻影龙', emoji: '🐉', rarity: 'epic', desc: '穿梭虚实的神秘巨龙', effect: 'fx-magic', skill: '✨空间扭曲' },
    { id: 9, name: '圣光狮', emoji: '🦁', rarity: 'epic', desc: '沐浴圣光的金色雄狮', effect: 'fx-magic', skill: '🌟神圣审判' },
  ],
  legendary: [
    { id: 10, name: '混沌神兽', emoji: '🦄', rarity: 'legendary', desc: '掌控万象的终极存在', effect: 'fx-magic', skill: '🌌混沌归元' },
  ]
};

const allPets = [...pets.common, ...pets.rare, ...pets.epic, ...pets.legendary];
let coins = 10;
let unlocked = new Set();
let isSpinning = false;

// 初始化图鉴
function initDex() {
  const grid = document.getElementById('dexGrid');
  allPets.forEach(p => {
    const item = document.createElement('div');
    item.className = 'dex-item';
    item.id = `dex-${p.id}`;
    item.innerHTML = `<span class="dex-emoji">❓</span><div>${p.name}</div>`;
    grid.appendChild(item);
  });
}

function unlockPet(pet) {
  if (!unlocked.has(pet.id)) {
    unlocked.add(pet.id);
    const item = document.getElementById(`dex-${pet.id}`);
    item.classList.add('unlocked');
    item.querySelector('.dex-emoji').textContent = pet.emoji;
    document.getElementById('unlockedCount').textContent = unlocked.size;
  }
}

function getRarityClass(r) {
  return `rarity-${r}`;
}
function getRarityText(r) {
  return { common: '普通', rare: '稀有', epic: '史诗', legendary: '传说' }[r];
}

function showPet(pet, isNew) {
  const display = document.getElementById('petDisplay');
  const effectHtml = pet.effect ? `<div style="font-size:40px;animation:floatUp 2s infinite">${pet.skill||''}</div>` : '';
  display.innerHTML = `
    <div class="pet-card" style="display:block">
      <span class="pet-emoji ${pet.effect||''}">${pet.emoji}</span>
      <div class="pet-name">${pet.name}</div>
      <div class="pet-rarity ${getRarityClass(pet.rarity)}">${getRarityText(pet.rarity)}${isNew?' ✨新获得!':''}</div>
      <div>${pet.desc}</div>
      ${pet.skill ? `<div style="margin-top:8px;font-weight:bold">${pet.skill}</div>` : ''}
      ${effectHtml}
    </div>
  `;
  unlockPet(pet);
}

async function draw() {
  if (isSpinning || coins <= 0) return;
  isSpinning = true;
  coins--;
  document.getElementById('coins').textContent = coins;
  document.getElementById('drawBtn').disabled = true;
  document.getElementById('result').textContent = '🎲 转动中...';
  
  const slots = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3')];
  slots.forEach(s => { s.classList.add('spinning'); s.classList.remove('match'); });
  
  // 模拟转动
  let ticks = 0;
  const spinInt = setInterval(() => {
    slots.forEach(s => {
      const rand = allPets[Math.floor(Math.random()*allPets.length)];
      s.textContent = rand.emoji;
    });
    ticks++;
    if (ticks > 20) {
      clearInterval(spinInt);
      finishDraw(slots);
    }
  }, 80);
}

function finishDraw(slots) {
  // 判定结果
  const isJackpot = Math.random() < 0.25; // 25%概率中奖
  let resultPets;
  
  if (isJackpot) {
    // 3格相同，根据概率出不同稀有度
    const r = Math.random();
    let pool;
    if (r < 0.4) pool = pets.common;
    else if (r < 0.75) pool = pets.rare;
    else if (r < 0.95) pool = pets.epic;
    else pool = pets.legendary;
    
    const winner = pool[Math.floor(Math.random()*pool.length)];
    resultPets = [winner, winner, winner];
    
    document.getElementById('result').innerHTML = `🎉 <span style="color:gold">JACKPOT!</span> 获得 ${winner.name}!`;
    showPet(winner, !unlocked.has(winner.id));
    if(!unlocked.has(winner.id)) coins += 5; // 新宠物奖励
    document.getElementById('coins').textContent = coins;
  } else {
    // 没中，随机3个
    resultPets = Array(3).fill().map(() => allPets[Math.floor(Math.random()*allPets.length)]);
    const consolation = pets.common[Math.floor(Math.random()*pets.common.length)];
    document.getElementById('result').textContent = `没凑齐~ 但获得了 ${consolation.name}(普通)`;
    showPet(consolation, !unlocked.has(consolation.id));
  }
  
  slots.forEach((s, i) => {
    s.classList.remove('spinning');
    s.textContent = resultPets[i].emoji;
    if (isJackpot) s.classList.add('match');
  });
  
  // 特效
  if (isJackpot && resultPets[0].effect) {
    createEffects(resultPets[0].effect);
  }
  
  setTimeout(() => {
    isSpinning = false;
    document.getElementById('drawBtn').disabled = coins <= 0;
    if(coins <= 0) document.getElementById('result').textContent += ' (没币了，刷新送5币)';
    if(coins === 0) coins = 5; // 保底
  }, 1000);
}

function createEffects(cls) {
  const display = document.getElementById('petDisplay');
  for(let i=0; i<5; i++) {
    setTimeout(() => {
      const ef = document.createElement('div');
      ef.className = `effect ${cls}`;
      ef.textContent = ['✨','⭐','💫','🌟'][Math.floor(Math.random()*4)];
      ef.style.left = (window.innerWidth/2 + (Math.random()-0.5)*200) + 'px';
      ef.style.top = '200px';
      document.body.appendChild(ef);
      setTimeout(() => ef.remove(), 1500);
    }, i*200);
  }
}

// 自动回币
setInterval(() => {
  if(coins < 10) {
    coins++;
    document.getElementById('coins').textContent = coins;
    document.getElementById('drawBtn').disabled = false;
  }
}, 8000);

initDex();
// 默认展示
showPet(pets.common[0], false);
</script>
</body>
</html>
