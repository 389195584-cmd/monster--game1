<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;}
body{background:linear-gradient(145deg,#0f0c29,#302b63,#24243e);color:#fff;min-height:100vh;overflow-x:hidden}
.container{max-width:480px;margin:0 auto;padding:14px;text-align:center;position:relative}
/* 万圣节装饰 */
.halloween-banner{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;background:radial-gradient(circle at 20% 30%,rgba(255,140,0,0.06),transparent 60%)}
.halloween-emoji{position:fixed;font-size:22px;opacity:0.12;pointer-events:none;animation:floatHalloween 8s ease-in-out infinite}

/* 头部 */

.logo{font-size:20px;font-weight:bold;background:linear-gradient(90deg,gold,#ff8800);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.coins-bar{background:rgba(255,215,0,0.1);padding:4px 14px;border-radius:20px;font-size:13px;border:1px solid rgba(255,215,0,0.2)}
.coins-bar span{color:gold}
/* 学习面板 */

.lib-tabs{display:flex;gap:4px;margin-bottom:8px;justify-content:center}

.lib-tab.active{background:rgba(255,215,0,0.12);border-color:gold;color:gold}
.word-card{background:rgba(255,255,255,0.06);border-radius:16px;padding:18px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.1);min-height:140px}
.word-en{font-size:28px;font-weight:bold;letter-spacing:0.5px;margin-bottom:4px}
.word-cn{font-size:18px;color:#ccc;min-height:26px;margin-bottom:6px}
.word-progress{font-size:11px;color:#888;margin-bottom:6px}
.word-actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.word-actions button{padding:7px 18px;border-radius:20px;border:none;font-size:13px;cursor:pointer;transition:all 0.15s;touch-action:manipulation}
.btn-know{background:#00cc66;color:#fff;box-shadow:0 2px 8px rgba(0,204,102,0.25)}

.btn-next{background:#0f3460;color:#fff}
.word-stats{font-size:11px;color:#aaa;margin-top:4px}
.wrong-link{font-size:11px;color:#ff6666;cursor:pointer;text-decoration:underline;margin-top:3px;display:inline-block}
/* 老虎机 */
.slot-panel{display:none;z-index:1;position:relative}
.slot-machine{background:rgba(255,255,255,0.05);border-radius:18px;padding:12px;border:2px solid rgba(255,165,0,0.15);margin-bottom:8px}
.up-label{background:linear-gradient(135deg,#ff6600,#ff3300);color:#fff;padding:2px 12px;border-radius:14px;font-size:10px;display:inline-block;margin-bottom:4px}
.slot-row{display:flex;justify-content:center;gap:6px;margin-bottom:10px;height:90px}
.slot-cell{width:72px;height:84px;background:#1a1a3e;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:36px;border:2px solid #333;transition:all 0.3s;position:relative}
.slot-cell.spin{animation:slotSpin 0.1s infinite linear}
@keyframes slotSpin{0%{transform:translateY(0)}25%{transform:translateY(-3px)}75%{transform:translateY(3px)}100%{transform:translateY(0)}}

@keyframes jpGlow{0%{box-shadow:0 0 10px gold}100%{box-shadow:0 0 30px orange}}
.btn-draw{background:linear-gradient(135deg,#e94560,#c23152);color:#fff;border:none;padding:10px 34px;font-size:15px;border-radius:28px;cursor:pointer;font-weight:bold;box-shadow:0 4px 15px rgba(233,69,96,0.4);transition:all 0.15s;touch-action:manipulation}

.draw-result{font-size:14px;margin-top:4px;min-height:20px;font-weight:bold}
.pity-text{font-size:10px;color:#666;margin-top:2px}

.pet-name{font-size:16px;font-weight:bold;margin-bottom:1px}
.pet-rarity-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;margin-bottom:3px}
.r-common{background:#666}
.r-rare{background:#0066cc;box-shadow:0 0 6px #0066cc}
.r-epic{background:#9900cc;box-shadow:0 0 10px #9900cc}

/* 签到面板 */
.checkin-panel{display:none;z-index:1;position:relative}
.checkin-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}

<script>
// ===== 音效系统 =====
const AC=window.AudioContext||window.webkitAudioContext;let ac;
function initAudio(){if(!ac)ac=new AudioContext()}
function playTone(freq,dur,type='sine',vol=0.07){
  try{initAudio();const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}
}
function sfxClick(){playTone(680,0.035,'square',0.04)}
function sfxWin(){playTone(550,0.08);setTimeout(()=>playTone(730,0.08),60);setTimeout(()=>playTone(920,0.12),60)}
function sfxJackpot(){playTone(820,0.1);setTimeout(()=>playTone(1050,0.1),70);setTimeout(()=>playTone(1280,0.16),70)}
function sfxHeart(){playTone(900,0.075);setTimeout(()=>playTone(1120,0.085),50)}
function sfxError(){playTone(250,0.12,'sawtooth',0.055)}

// ===== UP池 =====
function getUpPet(){
  const weekNum=Math.floor(Date.now()/(7*86400000));
  const rares=PETS.filter(p=>p.rarity==='rare'||p.rarity==='epic'||p.rarity==='legendary');
  return rares[weekNum%rares.length];
}

// ===== 存档 =====
let S=loadSave();
function defaultSave(){
  return{
    coins:20,unlocked:[],favor:{},pity:0,items:{double:0,reset:0},
    lastVisit:Date.now(),totalDraws:0,
    checkin:{lastDay:'',count:0,days:[]},
    travel:{active:false,endTime:0,petId:null},
    missTimer:0,missEnabled:true,
    word:{lib:'basic',idx:0,know:0,wrong:[],today:0,dailyGoal:50},
    settings:{sound:true,vibration:true}
  };
}
function loadSave(){
  try{
    const raw=localStorage.getItem('monsterSaveV2');
    if(raw){
      const d=JSON.parse(raw);
      const def=defaultSave();
      for(let k in def)if(d[k]===undefined)d[k]=def[k];
      const elapsed=Math.floor((Date.now()-d.lastVisit)/60000);
      if(elapsed>1&&elapsed<1440){
        const bonus=Math.min(Math.floor(elapsed/3),20);
        if(bonus>0){d.coins+=bonus;setTimeout(()=>showToast(`⏰ 离线${elapsed}分钟，获得${bonus}币`),600)}
      }
      d.lastVisit=Date.now();
      // 旅行完成检测
      if(d.travel.active&&Date.now()>d.travel.endTime){
        d.travel.active=false;
        const reward=Math.floor(Math.random()*3)+1;
        d.items.double=(d.items.double||0)+reward;
        setTimeout(()=>showToast(`✈️ 旅行归来！获得${reward}张双倍卡！`),1200);
      }
      return d;
    }
  }catch(e){}
  return defaultSave();
}
function save(){S.lastVisit=Date.now();localStorage.setItem('monsterSaveV2',JSON.stringify(S))}

// ===== Toast 提示 =====
function showToast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),1600)
}

// ===== 每日目标 =====
function setDailyGoal(n){
  if(typeof n==='number'&&n>0){
    S.word.dailyGoal=n;
    save();
    updateDailyGoalUI();
    showToast(`✅ 每日目标设为 ${n} 词`);
  }
}
function updateDailyGoalUI(){
  const today=S.word.today||0;
  const goal=S.word.dailyGoal||50;
  const pct=Math.min(100,Math.round(today/goal*100));
  // 如果已有目标显示区域则更新
  const el=document.getElementById('goalDisplay');
  if(el)el.innerHTML=`📊 今日进度: ${today}/${goal} (${pct}%)`;
  // 检查是否完成
  if(today>=goal&&today>0){
    const flag=document.getElementById('goalComplete');
    if(!flag){
      const banner=document.createElement('div');
      banner.id='goalComplete';
      banner.style.cssText='background:gold;color:#1a1a3e;padding:6px;border-radius:10px;font-size:13px;font-weight:bold;margin:6px 0;animation:popIn 0.3s';
      banner.textContent='🎉 今日目标已完成！太棒了！';
      const parent=document.getElementById('goalArea');
      if(parent)parent.appendChild(banner);
    }
  }
}

// ===== 英语学习 =====
let currentLib='basic',wordIdx=0;
function selectLib(lib,btn){
  sfxClick();
  document.querySelectorAll('.lib-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentLib=lib;wordIdx=0;
  showWord();
}
function showWord(){
  const lib=WORDS[currentLib];
  if(!lib||lib.length===0)return;
  if(wordIdx>=lib.length)wordIdx=0;
  const w=lib[wordIdx];
  document.getElementById('wordEn').textContent=w[0];
  document.getElementById('wordCn').textContent='???';
  document.getElementById('wordProgress').textContent=`进度: ${wordIdx+1}/${lib.length}`;
  speakWord(w[0]);
}
function speakWord(text){
  try{const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.8;speechSynthesis.speak(u)}catch(e){}
}
function markWord(know){
  sfxClick();
  const lib=WORDS[currentLib];
  if(!lib||wordIdx>=lib.length)return;
  const w=lib[wordIdx];
  document.getElementById('wordCn').textContent=w[1];
  if(!know){
    if(!S.word.wrong)S.word.wrong=[];
    if(!S.word.wrong.includes(w[0]))S.word.wrong.push(w[0]);
    showToast('❌ 已加入错题本');
  }else{
    S.word.know=(S.word.know||0)+1;
    S.word.today=(S.word.today||0)+1;
    let bonus=1;
    if(S.items.double&&S.items.double>0&&Math.random()<0.25){
      bonus=2;S.items.double--;
      showToast('🎫 双倍卡生效！+2币');
    }
    S.coins+=bonus;
    showToast(`✅ 答对了！+${bonus}币`);
    updateDailyGoalUI();
    checkMiss();
  }
  updateWordStats();
  save();updateUI();
}
function nextWord(){sfxClick();wordIdx++;showWord()}
function reviewWrong(){
  if(!S.word.wrong||S.word.wrong.length===0){showToast('🎉 错题本为空！');return}
  const w=S.word.wrong[0];
  const all=[...WORDS.basic,...WORDS.cet3,...WORDS.cet4];
  for(let lib of ['basic','cet3','cet4']){
    const idx=WORDS[lib].findIndex(x=>x[0]===w);
    if(idx>=0){
      currentLib=lib;
      document.querySelectorAll('.lib-tab').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.lib-tab')[['basic','cet3','cet4'].indexOf(lib)].classList.add('active');
      wordIdx=idx;showWord();break;
    }
  }
}
function updateWordStats(){
  const total=WORDS[currentLib].length;
  const known=S.word.know||0;
  const rate=total>0?Math.round(known/total*100):0;
  document.getElementById('wordStats').textContent=`今日学习: ${S.word.today||0}词 | 掌握率: ${rate}%`;
  document.getElementById('wrongCount').textContent=S.word.wrong?S.word.wrong.length:0;
  document.getElementById('wordCount').textContent=S.word.today||0;
}

// ===== 宠物思念系统 =====
let currentPetId=null;
function checkMiss(){
  if(!currentPetId||!S.missEnabled||S.missTimer>Date.now())return;
  const pet=PETS.find(p=>p.id===currentPetId);
  if(!pet)return;
  const fav=S.favor[currentPetId]||0;
  if(fav<2)return;
  if(Math.random()<0.18){
    document.getElementById('missIcon').textContent=pet.emoji;
    const msgs=['主人，我想你了...','今天有好好背单词吗？','我在等你来看我~','一起学习好不好？','🎃 不给糖就捣蛋~'];
    document.getElementById('missMsg').textContent=msgs[Math.floor(Math.random()*msgs.length)];
    const hints=['来复习一个单词吧！','让我看看你学了什么~','我来帮你记单词！'];
    document.getElementById('missHint').textContent=hints[Math.floor(Math.random()*hints.length)];
    document.getElementById('missMask').style.display='flex';
    S.missTimer=Date.now()+300000;
    save();
  }
}
function closeMiss(){document.getElementById('missMask').style.display='none'}
function missReview(){
  closeMiss();
  if(S.word.wrong&&S.word.wrong.length>0){
    const w=S.word.wrong[Math.floor(Math.random()*S.word.wrong.length)];
    const all=[...WORDS.basic,...WORDS.cet3,...WORDS.cet4];
    const found=all.find(x=>x[0]===w);
    if(found){
      switchTab('learn');
      document.getElementById('wordEn').textContent=found[0];
      document.getElementById('wordCn').textContent=found[1];
      showToast('📕 复习错题: '+found[0]+' = '+found[1]);
      speakWord(found[0]);
    }
  }else{showToast('🎉 错题本为空！继续加油！')}
}

// ===== 宠物显示 =====
function showPet(pet,isNew){
  currentPetId=pet.id;
  const fav=S.favor[pet.id]||0;
  const level=Math.floor(fav/3)+1;
  const evolved=level>=10;
  const emoji=evolved?pet.emoji+pet.emoji:pet.emoji;
  const ta=S.travel.active&&S.travel.petId===pet.id;
  const tr=ta?Math.max(0,Math.floor((S.travel.endTime-Date.now())/1000)):0;
  const d=document.getElementById('petDisplay');
  const rarityNames={common:'普通',rare:'稀有',epic:'史诗',legendary:'传说'};
  d.innerHTML=`
    <div class="pet-card" style="display:block">
      <span class="pet-emoji" onclick="petClick(${pet.id})" style="${evolved?'font-size:62px;filter:drop-shadow(0 0 8px gold)':''}" id="petEmojiEl">${emoji}</span>
      <div class="pet-name">${pet.name} ${evolved?'✨':'Lv.'+level}</div>
      <div class="pet-rarity-badge r-${pet.rarity}">${rarityNames[pet.rarity]}</div>
      <div style="font-size:11px;color:#ccc">${pet.desc}</div>
      <div class="favor-bar">❤️ 好感 ${fav}/30 ${evolved?'已进化！':'(点击增加)'}</div>
      ${isNew&&pet.story?`<div class="pet-story">📖 ${pet.story}</div>`:''}
      <div class="action-btns">
        ${ta?`<span style="font-size:11px;color:#88ccff">✈️ 旅行中... 剩余${Math.floor(tr/60)}分${tr%60}秒</span>`:
          `<button class="action-btn" onclick="startTravel(${pet.id})">✈️ 去旅行(20分钟)</button>`}
      </div>
    </div>
  `;
}
function petClick(id){
  sfxHeart();
  S.favor[id]=(S.favor[id]||0)+1;
  const fav=S.favor[id];
  const level=Math.floor(fav/3)+1;
  // 爱心粒子
  const emojiEl=document.getElementById('petEmojiEl');
  if(emojiEl){
    for(let i=0;i<3;i++){
      const h=document.createElement('div');h.className='heart-particle';h.textContent='❤️';
      h.style.left=(emojiEl.offsetLeft+15+Math.random()*30)+'px';
      h.style.top=(emojiEl.offsetTop+5)+'px';
      document.getElementById('petDisplay').appendChild(h);
      setTimeout(()=>h.remove(),800);
    }
  }
  if(level>=10&&fav%3===0)showToast(`🌟 ${PETS.find(p=>p.id===id).name} 已进化！`);
  save();updateUI();
}

// ===== 旅行系统 =====
function startTravel(id){
  if(S.travel.active){showToast('⚠️ 已经有宠物在旅行了！');return}
  sfxClick();
  S.travel={active:true,endTime:Date.now()+1200000,petId:id}; // 20分钟
  save();
  showToast('✈️ 宠物出发旅行了！20分钟后回来~');
  showPet(PETS.find(p=>p.id===id),false);
}

// ===== 老虎机抽卡 =====
function startDraw(){
  if(S.coins<1){showToast('❌ 金币不足！去背单词赚钱吧~');sfxError();return}
  sfxClick();
  S.coins--;S.totalDraws=(S.totalDraws||0)+1;
  document.getElementById('drawBtn').disabled=true;
  // 转盘动画
  const s1=document.getElementById('s1'),s2=document.getElementById('s2'),s3=document.getElementById('s3');
  s1.classList.add('spin');s2.classList.add('spin');s3.classList.add('spin');
  const emojis=['🟢','🦇','🍄','👻','🐺','🦅','🐯','🦊','🦋','🐉','🦁','🦄'];
  let count=0;
  const interval=setInterval(()=>{
    s1.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    s2.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    s3.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    count++;
    if(count>15){
      clearInterval(interval);
      // 计算结果
      const upPet=getUpPet();
      const pool=[...PETS];
      // 保底
      S.pity=(S.pity||0)+1;
      let result;
      if(S.pity>=10){
        result=pool.filter(p=>p.rarity==='rare'||p.rarity==='epic'||p.rarity==='legendary');
        result=result[Math.floor(Math.random()*result.length)];
        S.pity=0;
      }else{
        const r=Math.random();
        if(r<0.005)result=pool.filter(p=>p.rarity==='legendary')[0];
        else if(r<0.025)result=pool.filter(p=>p.rarity==='epic')[Math.floor(Math.random()*2)];
        else if(r<0.125)result=pool.filter(p=>p.rarity==='rare')[Math.floor(Math.random()*5)];
        else result=pool.filter(p=>p.rarity==='common')[Math.floor(Math.random()*4)];
        // UP池加成
        if(Math.random()<0.33&&upPet)result=upPet;
      }
      s1.classList.remove('spin');s2.classList.remove('spin');s3.classList.remove('spin');
      s1.textContent=result.emoji;s2.textContent=result.emoji;s3.textContent=result.emoji;
      s1.classList.add('jackpot');s2.classList.add('jackpot');s3.classList.add('jackpot');
      sfxJackpot();
      // 解锁宠物
      if(!S.unlocked.includes(result.id)){
        S.unlocked.push(result.id);
        showToast(`🎉 获得新宠物：${result.name}！`);
        showPet(result,true);
      }else{
        // 重复转化为好感度
        S.favor[result.id]=(S.favor[result.id]||0)+2;
        showToast(`💕 重复获得${result.name}，好感+2`);
        showPet(result,false);
      }
      document.getElementById('result').textContent=`✨ 获得：${result.name}`;
      document.getElementById('pityCount').textContent=S.pity;
      document.getElementById('drawBtn').disabled=false;
      setTimeout(()=>{s1.classList.remove('jackpot');s2.classList.remove('jackpot');s3.classList.remove('jackpot')},2000);
      save();updateUI();
    }
  },80);
}

// ===== 签到 =====
function renderCheckin(){
  const grid=document.getElementById('checkinGrid');
  if(!grid)return;
  const days=S.checkin.days||[];
  let html='';
  for(let i=0;i<7;i++){
    const done=days.includes(i);
    const isToday=i===new Date().getDay();
    html+=`<div class="checkin-cell ${done?'done':''} ${isToday?'today':''}">${done?'✅':'⬜'} Day ${i+1}</div>`;
  }
  grid.innerHTML=html;
}
function doCheckin(){
  const todayKey=new Date().toDateString();
  if(S.checkin.lastDay===todayKey){showToast('⚠️ 今天已经签到了！');return}
  sfxWin();
  S.checkin.lastDay=todayKey;
  S.checkin.count=(S.checkin.count||0)+1;
  const dayOfWeek=new Date().getDay();
  if(!S.checkin.days)S.checkin.days=[];
  if(!S.checkin.days.includes(dayOfWeek))S.checkin.days.push(dayOfWeek);
  const bonus=5+S.checkin.count;
  S.coins+=bonus;
  showToast(`📅 签到成功！+${bonus}币（连续${S.checkin.count}天）`);
  renderCheckin();
  save();updateUI();
}

// ===== 导航切换 =====
function switchTab(tab){
  sfxClick();
  document.querySelectorAll('.screen').forEach(s=>s.style.display='none');
  const map={learn:'learnPanel',slot:'slotPanel',checkin:'checkinPanel',dex:'dexPanel',settings:'settingsPanel'};
  const el=document.getElementById(map[tab]);
  if(el)el.style.display='block';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const navMap={learn:0,slot:1,checkin:2,dex:3,settings:4};
  const items=document.querySelectorAll('.nav-item');
  if(items[navMap[tab]])items[navMap[tab]].classList.add('active');
  // 渲染对应面板
  if(tab==='dex')renderDex();
  if(tab==='checkin')renderCheckin();
}

// ===== 图鉴 =====
function renderDex(){
  const grid=document.getElementById('dexGrid');
  if(!grid)return;
  let html='';
  PETS.forEach(p=>{
    const owned=S.unlocked.includes(p.id);
    html+=`<div class="dex-item ${owned?'owned':''}"><span class="dex-emoji">${owned?p.emoji:'❓'}</span>${owned?p.name:'???'}</div>`;
  });
  grid.innerHTML=html;
  document.getElementById('unlockedCount').textContent=S.unlocked.length;
}

// ===== UI更新 =====
function updateUI(){
  document.getElementById('coins').textContent=S.coins;
  document.getElementById('wordCount').textContent=S.word.today||0;
  document.getElementById('pityCount').textContent=S.pity||0;
  updateWordStats();
  updateDailyGoalUI();
}

// ===== 初始化 =====
function init(){
  // 创建万圣节装饰
  const halloweenBg=document.createElement('div');
  halloweenBg.className='halloween-banner';
  document.body.appendChild(halloweenBg);
  const halloweenEmojis=['🎃','👻','🕸️','🧛','🦇'];
  halloweenEmojis.forEach((e,i)=>{
    const el=document.createElement('div');
    el.className='halloween-emoji';
    el.textContent=e;
    el.style.left=(10+i*20)+'%';
    el.style.bottom=(10+Math.random()*30)+'%';
    el.style.animationDelay=(i*1.5)+'s';
    document.body.appendChild(el);
  });
  // 显示初始宠物
  if(S.unlocked.length>0){
    const firstPet=PETS.find(p=>p.id===S.unlocked[0]);
    if(firstPet)showPet(firstPet,false);
  }
  updateUI();
  // 思念定时器
  setInterval(checkMiss,30000);
  // 每日目标UI
  const goalArea=document.createElement('div');
  goalArea.id='goalArea';
  goalArea.style.cssText='margin:8px 0;text-align:center';
  goalArea.innerHTML=`
    <div style="font-size:12px;color:#aaa;margin-bottom:4px">🎯 每日目标</div>
    <div style="display:flex;gap:4px;justify-content:center;margin-bottom:4px">
      <button class="action-btn" onclick="setDailyGoal(20)">20词</button>
      <button class="action-btn" onclick="setDailyGoal(50)">50词</button>
      <button class="action-btn" onclick="setDailyGoal(100)">100词</button>
    </div>
    <div class="input-row" style="display:flex;gap:4px;justify-content:center;margin-bottom:4px">
      <input type="number" id="customGoalInput" placeholder="自定义" style="width:80px;padding:4px 8px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);color:#fff;font-size:12px;text-align:center">
      <button class="action-btn" onclick="const v=parseInt(document.getElementById('customGoalInput').value);if(v>0)setDailyGoal(v)">确定</button>
    </div>
    <div id="goalDisplay" style="font-size:13px;color:gold"></div>
  `;
  document.getElementById('learnPanel').insertBefore(goalArea,document.getElementById('learnPanel').firstChild);
  updateDailyGoalUI();
}

// 页面加载完成后执行
document.addEventListener('DOMContentLoaded',init);
</script>
