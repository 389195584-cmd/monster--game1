<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词怪兽 · 英语学习伴侣</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;min-height:100vh;overflow-x:hidden}
.container{max-width:480px;margin:0 auto;padding:16px;text-align:center}
h1{font-size:22px;margin:8px 0 2px;text-shadow:0 2px 10px rgba(255,215,0,0.3)}
.subtitle{font-size:12px;color:#aaa;margin-bottom:8px}
.coins{font-size:15px;color:gold;margin-bottom:8px;background:rgba(255,215,0,0.1);padding:5px 14px;border-radius:20px;display:inline-block}
/* 学习模块 - 主功能 */
.learn-panel{display:block;margin-top:8px;text-align:left}
.word-card{background:rgba(255,255,255,0.07);border-radius:16px;padding:18px;margin-bottom:10px;border:1px solid rgba(255,255,255,0.12);min-height:150px;text-align:center}
.word-english{font-size:30px;font-weight:bold;margin-bottom:6px;color:#fff;letter-spacing:1px}
.word-chinese{font-size:19px;color:#ddd;margin-bottom:10px;min-height:28px}
.word-progress{font-size:12px;color:#888;margin-bottom:6px}
.word-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.word-controls button{padding:8px 20px;border-radius:20px;border:none;font-size:14px;cursor:pointer;transition:all 0.2s;touch-action:manipulation}
.btn-know{background:#00cc66;color:#fff;box-shadow:0 2px 8px rgba(0,204,102,0.3)}
.btn-dont{background:#e94560;color:#fff;box-shadow:0 2px 8px rgba(233,69,96,0.3)}
.btn-next{background:#0f3460;color:#fff}
.word-stats{font-size:12px;color:#aaa;margin-top:6px;text-align:center}
.lib-select{display:flex;gap:5px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.lib-btn{padding:5px 12px;border-radius:14px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:#aaa;font-size:11px;cursor:pointer;transition:all 0.2s}
.lib-btn.active{background:rgba(255,215,0,0.12);border-color:gold;color:gold}
.wrong-book{font-size:12px;color:#ff6666;margin-top:5px;cursor:pointer;text-decoration:underline}
/* 宠物思念弹窗 */
.miss-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.82);display:none;z-index:997;justify-content:center;align-items:center;flex-direction:column}
.miss-box{background:linear-gradient(135deg,#1a1a3e,#302b63);border-radius:18px;padding:24px 20px;text-align:center;border:2px solid rgba(255,215,0,0.3);max-width:320px;animation:fadeIn 0.3s}
.miss-emoji{font-size:56px;display:block;margin-bottom:6px}
.miss-text{font-size:17px;color:#fff;margin-bottom:4px}
.miss-sub{font-size:13px;color:#ccc;margin-bottom:10px}
.miss-btn{background:gold;color:#1a1a3e;border:none;padding:8px 24px;border-radius:20px;font-size:14px;font-weight:bold;cursor:pointer;margin:3px}
/* 老虎机 */
.slot-machine{background:rgba(255,255,255,0.06);border-radius:20px;padding:14px;margin-bottom:10px;border:2px solid rgba(255,215,0,0.15)}
.slots{display:flex;justify-content:center;gap:8px;margin-bottom:12px;height:100px}
.slot{width:78px;height:90px;background:#1a1a3e;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;border:3px solid #444;transition:all 0.3s;position:relative}
.slot.shake{animation:shake 0.25s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.slot.match{border-color:gold;box-shadow:0 0 18px gold;animation:pulseGold 0.7s infinite}
@keyframes pulseGold{0%,100%{box-shadow:0 0 12px gold}50%{box-shadow:0 0 28px gold}}
.up-badge{background:linear-gradient(135deg,#ff6600,#ff3300);color:#fff;padding:2px 10px;border-radius:14px;font-size:10px;display:inline-block;margin-bottom:4px}
.btn{background:linear-gradient(135deg,#e94560,#c23152);color:#fff;border:none;padding:10px 32px;font-size:15px;border-radius:28px;cursor:pointer;font-weight:bold;box-shadow:0 4px 15px rgba(233,69,96,0.4);transition:all 0.2s;touch-action:manipulation}
.btn:active{transform:scale(0.94)}
.btn:disabled{background:#555;box-shadow:none;cursor:not-allowed}
.btn-small{padding:5px 14px;font-size:12px;border-radius:14px}
.result-text{font-size:15px;margin-top:6px;min-height:22px;font-weight:bold}
/* 宠物卡片 */
.pet-display{margin-top:10px;min-height:130px}
.pet-card{background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));border-radius:16px;padding:14px;border:1px solid rgba(255,255,255,0.12);display:none;animation:fadeIn 0.35s}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pet-emoji{font-size:54px;display:block;margin-bottom:3px;cursor:pointer;transition:transform 0.15s;position:relative}
.pet-emoji:active{transform:scale(0.92)}
.pet-name{font-size:17px;font-weight:bold;margin-bottom:2px}
.pet-rarity{display:inline-block;padding:2px 8px;border-radius:14px;font-size:10px;margin-bottom:4px}
.rarity-common{background:#666}
.rarity-rare{background:#0066cc;box-shadow:0 0 6px #0066cc}
.rarity-epic{background:#9900cc;box-shadow:0 0 10px #9900cc}
.rarity-legendary{background:#ff6600;box-shadow:0 0 14px #ff6600}
.favor-text{font-size:11px;color:#ff99cc;margin-top:2px}
.story-text{font-size:11px;color:#ccc;font-style:italic;margin-top:3px;padding:5px;background:rgba(255,255,255,0.03);border-radius:5px}
.work-status{font-size:11px;color:#88ff88;margin-top:3px}
.mood-text{font-size:10px;color:#aaa;margin-top:1px}
.hearts{position:absolute;pointer-events:none;font-size:18px;animation:heartFloat 0.7s forwards}
@keyframes heartFloat{0%{transform:translateY(0) scale(0.5);opacity:1}100%{transform:translateY(-45px) scale(1.4);opacity:0}}
/* 旅游 */
.travel-section{font-size:11px;color:#88ccff;margin-top:4px;cursor:pointer;text-decoration:underline}
.travel-result{font-size:12px;color:gold;margin-top:3px}
/* 小游戏 */
.minigame-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.87);display:none;z-index:999;justify-content:center;align-items:center;flex-direction:column}
.minigame-area{width:260px;height:340px;background:#1a1a3e;border-radius:14px;position:relative;overflow:hidden;border:2px solid gold}
.star-falling{position:absolute;font-size:24px;animation:starFall 2s linear forwards;cursor:pointer}
@keyframes starFall{0%{transform:translateY(-30px);opacity:1}100%{transform:translateY(360px);opacity:0.3}}
.minigame-score{font-size:17px;color:gold;margin-top:6px}
/* 签到 */
.checkin-panel{display:none;margin-top:10px}
.checkin-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.checkin-day{background:rgba(255,255,255,0.05);border-radius:5px;padding:6px 1px;text-align:center;font-size:10px;border:1px solid rgba(255,255,255,0.07)}
.checkin-day.done{background:rgba(255,215,0,0.12);border-color:gold;color:gold}
.checkin-day.today{border-color:#e94560;box-shadow:0 0 6px rgba(233,69,96,0.4)}
.challenge-item{background:rgba(255,255,255,0.04);border-radius:6px;padding:6px;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;font-size:11px}
/* 图鉴 */
.dex{display:none;margin-top:10px;text-align:left}
.dex h3{border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:3px;font-size:13px}
.dex-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px;max-height:220px;overflow-y:auto}
.dex-item{background:rgba(255,255,255,0.04);border-radius:6px;padding:5px 1px;text-align:center;font-size:9px;border:1px solid rgba(255,255,255,0.05)}
.dex-item.unlocked{border-color:gold;background:rgba(255,215,0,0.08)}
.dex-emoji{font-size:22px;display:block}
/* 设置 */
.settings{display:none;margin-top:10px}
.setting-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;margin:2px;font-size:12px}
/* 导航 */
.nav{display:flex;justify-content:space-around;margin-top:14px;padding:6px 0;border-top:1px solid rgba(255,255,255,0.08)}
.nav-btn{background:none;border:none;color:#888;font-size:12px;padding:5px 8px;cursor:pointer;border-radius:6px;transition:all 0.2s}
.nav-btn.active{color:gold;background:rgba(255,215,0,0.08)}
/* 特效 */
.bonus-text{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:bold;color:gold;text-shadow:0 0 22px gold;pointer-events:none;animation:bonusPop 1.2s forwards;z-index:996}
@keyframes bonusPop{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0}30%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
/* 名片 */
.card-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.91);display:none;z-index:998;justify-content:center;align-items:center;flex-direction:column}
.business-card{width:290px;padding:20px 14px;background:linear-gradient(135deg,#1a1a3e,#302b63);border-radius:14px;border:2px solid gold;text-align:center}
.card-title{font-size:18px;font-weight:bold;color:gold;margin-bottom:6px}
.card-pet{font-size:46px;display:block;margin:6px 0}
.card-info{font-size:12px;color:#ccc;line-height:1.5}
.card-footer{font-size:9px;color:#666;margin-top:10px}
</style>
</head>
<body>
<div class="container" id="appContainer">
  <h1>📚 单词怪兽</h1>
  <div class="subtitle">背单词赚币 · 养宠物更爱学习</div>
  <div class="coins">💰 <span id="coins">15</span> 币 | 📖 已学 <span id="wordCount">0</span> 词</div>
  
  <!-- 学习面板 - 主功能 -->
  <div class="learn-panel" id="tabLearn">
    <div class="lib-select">
      <button class="lib-btn active" onclick="selectLib('basic',this)">基础 3178词</button>
      <button class="lib-btn" onclick="selectLib('cet3',this)">三级 1115词</button>
      <button class="lib-btn" onclick="selectLib('cet4',this)">四级 1463词</button>
    </div>
    <div class="word-card" id="wordCard">
      <div class="word-english" id="wordEn">apple</div>
      <div class="word-chinese" id="wordCn">苹果</div>
      <div class="word-progress" id="wordProgress">进度: 0/50</div>
      <div class="word-controls">
        <button class="btn-know" onclick="markWord(true)">✅ 认识</button>
        <button class="btn-dont" onclick="markWord(false)">❌ 不认识</button>
        <button class="btn-next" onclick="nextWord()">➡️ 下一题</button>
      </div>
    </div>
    <div class="word-stats" id="wordStats">今日学习: 0词 | 掌握率: 0%</div>
    <div class="wrong-book" onclick="reviewWrong()">📕 错题本 (<span id="wrongCount">0</span>题)</div>
  </div>
  
  <!-- 抽卡面板 -->

    <div id="upBadge" class="up-badge" style="display:none">🔥 UP: ???</div>

      <div class="slot" id="s2">❓</div>
      <div class="slot" id="s3">❓</div>

    <div class="result-text" id="result"></div>
    <div style="font-size:10px;color:#666;margin-top:3px">保底: 已抽 <span id="pityCount">0</span> 次</div>
  </div>
  
  <!-- 签到面板 -->
  <div class="checkin-panel" id="tabCheckin" style="display:none">
    <h3 style="font-size:15px">📅 每日签到</h3>
    <div class="checkin-grid" id="checkinGrid"></div>
    <button class="btn btn-small" onclick="doCheckin()" id="checkinBtn" style="margin-top:6px">签到</button>
    <div id="checkinResult" style="font-size:12px;color:gold;margin-top:3px"></div>
    <h3 style="margin-top:10px;font-size:13px">🏆 每日挑战</h3>
    <div id="challenges"></div>
  </div>
  
  <!-- 图鉴面板 -->
  <div class="dex" id="tabDex" style="display:none">
    <h3>📖 宠物图鉴 (<span id="unlockedCount">0</span>/10)</h3>
    <div class="dex-grid" id="dexGrid"></div>
  </div>
  
  <!-- 设置面板 -->
  <div class="settings" id="tabSettings" style="display:none">
    <h3 style="font-size:15px">⚙️ 设置</h3>
    <button class="setting-btn" onclick="generateCard()">🃏 生成名片</button>
    <button class="setting-btn" onclick="exportSave()">📤 导出存档</button>
    <button class="setting-btn" onclick="importSave()">📥 导入存档</button>
    <div style="font-size:10px;color:#aaa;margin-top:5px">背单词赚币 · 点击宠物加好感</div>
  </div>
  
  <!-- 宠物展示 -->
  <div class="pet-display" id="petDisplay"></div>
  
  <!-- 导航 -->
  <div class="nav">
    <button class="nav-btn active" onclick="switchTab('learn',this)">📚学习</button>
    <button class="nav-btn" onclick="switchTab('main',this)">🎰抽卡</button>
    <button class="nav-btn" onclick="switchTab('checkin',this)">📅签到</button>
    <button class="nav-btn" onclick="switchTab('dex',this)">📖图鉴</button>
    <button class="nav-btn" onclick="switchTab('settings',this)">⚙️设置</button>
  </div>
</div>

<!-- 宠物思念弹窗 -->
<div class="miss-overlay" id="missOverlay">
  <div class="miss-box">
    <span class="miss-emoji" id="missEmoji">🐱</span>
    <div class="miss-text" id="missText">主人，我想你了...</div>
    <div class="miss-sub" id="missSub">来复习一个单词吧！</div>
    <button class="miss-btn" onclick="missReview()">📖 复习单词</button>
    <button class="miss-btn" onclick="closeMiss()" style="background:#555;color:#fff">稍后再说</button>

</div>

<!-- 小游戏弹窗 -->
<div class="minigame-overlay" id="minigameOverlay">
  <h2 style="font-size:18px">⭐ 接星星</h2>
  <div class="minigame-area" id="minigameArea"></div>

  <button class="btn btn-small" onclick="closeMinigame()" style="margin-top:6px">关闭</button>
</div>

<!-- 名片弹窗 -->
<div class="card-overlay" id="cardOverlay">
  <div class="business-card" id="businessCard">
    <div class="card-title">🎴 单词收藏家</div>
    <span class="card-pet" id="cardPetEmoji">🦄</span>
    <div class="card-info" id="cardInfo">加载中...</div>
    <div class="card-footer">长按保存分享</div>
  </div>
  <button class="btn btn-small" onclick="closeCard()" style="margin-top:14px">关闭</button>
</div>

<script>
// ===== 音效 =====
const AC=window.AudioContext||window.webkitAudioContext;let ac;
function ia(){if(!ac)ac=new AC()}
function pt(f,d,t='sine',v=0.09){try{ia();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function sc(){pt(780,0.05,'square',0.045)}
function ss(){pt(300+Math.random()*380,0.022,'sawtooth',0.032)}
function sw(){pt(520,0.1);setTimeout(()=>pt(655,0.1),70);setTimeout(()=>pt(780,0.14),70)}

let S=loadSave();
function defaultSave(){
  return{
    coins:15,unlocked:[],favor:{},pity:0,items:{double:0,reset:0},
    lastVisit:Date.now(),totalDraws:0,
    checkin:{lastDay:'',count:0,days:[]},
    challenges:{draw:0,click:0,collect:0,date:''},
    work:{active:false,endTime:0,petId:null},
    travel:{active:false,endTime:0,petId:null},
    mood:{},
    missTimer:0,
    word:{lib:'basic',idx:0,know:0,wrong:[],today:0,stats:{}},
    _rewardCommon:false,_rewardRare:false
  };
}
function loadSave(){
  try{
    const raw=localStorage.getItem('petSaveFull');
    if(raw){
      const d=JSON.parse(raw);
      const def=defaultSave();
      for(let k in def)if(d[k]===undefined)d[k]=def[k];
      const el=Math.floor((Date.now()-d.lastVisit)/60000);
      if(el>1&&el<1440){
        const bn=Math.min(Math.floor(el/3),20);
        if(bn>0){d.coins+=bn;setTimeout(()=>sb(`⏰ 离线${el}分钟，获得${bn}币!`),500)}
      }
      for(let pid in d.mood)if(d.mood[pid]<100)d.mood[pid]=Math.min(100,d.mood[pid]+Math.floor(el/5));
      d.lastVisit=Date.now();
      if(d.work.active&&Date.now()>d.work.endTime){d.coins+=5;d.work.active=false;setTimeout(()=>sb('💼 打工完成!获得5币!'),1000)}
      if(d.travel.active&&Date.now()>d.travel.endTime){d.travel.active=false;const rw=Math.floor(Math.random()*3)+1;d.items.double=(d.items.double||0)+rw;setTimeout(()=>sb(`✈️ 旅行归来!获得${rw}张双倍卡!`),1500)}
      return d;
    }
  }catch(e){}
  return defaultSave();
}
function sv(){S.lastVisit=Date.now();localStorage.setItem('petSaveFull',JSON.stringify(S));}
function sb(t){const e=document.createElement('div');e.className='bonus-text';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}

function checkMiss(){
  if(!currentPetId||S.missTimer>Date.now())return;
  const pet=ALL_PETS.find(p=>p.id===currentPetId);
  if(!pet)return;
  const fav=S.favor[currentPetId]||0;
  if(fav<2)return;
  const r=Math.random();
  if(r<0.15){
    document.getElementById('missEmoji').textContent=pet.emoji;
    const msgs=['主人，我想你了...','今天有好好背单词吗？','我在等你来看我~','一起学习好不好？'];
    document.getElementById('missText').textContent=msgs[Math.floor(Math.random()*msgs.length)];
    const subs=['来复习一个单词吧！','让我看看你学了什么~','我来帮你记单词！'];
    document.getElementById('missSub').textContent=subs[Math.floor(Math.random()*subs.length)];
    document.getElementById('missOverlay').style.display='flex';
    S.missTimer=Date.now()+300000;
    sv();
  }
}
function closeMiss(){
  document.getElementById('missOverlay').style.display='none';
}
function missReview(){
  closeMiss();
  // 复习一个错题本里的词
  if(S.word.wrong&&S.word.wrong.length>0){
    const w=S.word.wrong[Math.floor(Math.random()*S.word.wrong.length)];
    const allWords=[...WORDS.basic,...WORDS.cet3,...WORDS.cet4];
    const found=allWords.find(x=>x[0]===w);
    if(found){
      switchTab('learn',document.querySelector('.nav-btn'));
      document.getElementById('wordEn').textContent=found[0];
      document.getElementById('wordCn').textContent=found[1];
      sb('📕 复习错题: '+found[0]+' = '+found[1]);
      try{const u=new SpeechSynthesisUtterance(found[0]);u.lang='en-US';u.rate=0.8;speechSynthesis.speak(u)}catch(e){}
    }
  }else{
    sb('🎉 错题本为空！继续加油！');
  }
}

// ===== 英语学习 - 核心功能 =====
let currentLib='basic',wordIdx=0;
function selectLib(lib,btn){
  sc();
  document.querySelectorAll('.lib-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentLib=lib;
  wordIdx=0;
  showWord();
}
function showWord(){
  const lib=WORDS[currentLib];
  if(!lib||lib.length===0)return;
  if(wordIdx>=lib.length)wordIdx=0;
  const w=lib[wordIdx];
  document.getElementById('wordEn').textContent=w[0];
  document.getElementById('wordCn').textContent='???';
  document.getElementById('wordProgress').textContent=`进度: ${wordIdx+1}/${lib.length}`;
  try{
    const u=new SpeechSynthesisUtterance(w[0]);u.lang='en-US';u.rate=0.8;speechSynthesis.speak(u);
  }catch(e){}
}
function markWord(know){
  sc();
  const lib=WORDS[currentLib];
  if(!lib||wordIdx>=lib.length)return;
  const w=lib[wordIdx];
  document.getElementById('wordCn').textContent=w[1];
  if(!know){
    if(!S.word.wrong)S.word.wrong=[];
    if(!S.word.wrong.includes(w[0]))S.word.wrong.push(w[0]);
    sb('❌ 已加入错题本');
  }else{
    S.word.know=(S.word.know||0)+1;
    S.word.today=(S.word.today||0)+1;
    // 答对奖励 - 可能有双倍
    let bonus=1;
    if(S.items.double&&S.items.double>0&&Math.random()<0.2){
      bonus=2;S.items.double--;
      sb('🎫 双倍卡生效! +2币');
    }
    S.coins+=bonus;
    sb(`✅ 答对了! +${bonus}币`);
    // 随机触发宠物思念
    checkMiss();
  }
  updateWordStats();
  sv();
  ui();
}
function nextWord(){
  sc();
  wordIdx++;
  showWord();
}
function reviewWrong(){
  if(!S.word.wrong||S.word.wrong.length===0){
    document.getElementById('result').textContent='🎉 错题本为空!';
    return;
  }
  const w=S.word.wrong[0];
  const allWords=[...WORDS.basic,...WORDS.cet3,...WORDS.cet4];
  const found=allWords.findIndex(x=>x[0]===w);
  if(found>=0){
    // 找到对应的词库
    for(let lib of ['basic','cet3','cet4']){
      const idx=WORDS[lib].findIndex(x=>x[0]===w);
      if(idx>=0){
        currentLib=lib;
        document.querySelectorAll('.lib-btn').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.lib-btn')[['basic','cet3','cet4'].indexOf(lib)].classList.add('active');
        wordIdx=idx;
        showWord();
        break;
      }
    }
  }
  document.getElementById('result').textContent='📕 复习错题中...';
}
function updateWordStats(){
  const total=WORDS[currentLib].length;
  const known=S.word.know||0;
  const rate=total>0?Math.round(known/total*100):0;
  document.getElementById('wordStats').textContent=`今日学习: ${S.word.today||0}词 | 掌握率: ${rate}%`;
  document.getElementById('wrongCount').textContent=S.word.wrong?S.word.wrong.length:0;
  document.getElementById('wordCount').textContent=S.word.today||0;
}
